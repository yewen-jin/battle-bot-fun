<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OOF: The BattleBots Pro League, Re-enacted Badly</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #111; color: #eee; font: 13px/1.4 monospace; display: flex; }
  #stage { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px; flex: 1; min-width: 0; }
  #canvasHost { max-width: 100%; }
  #caption { white-space: pre; text-align: center; min-height: 2.4em; }
  #panel { width: 280px; flex-shrink: 0; max-height: 100vh; overflow-y: auto; padding: 12px; background: #1a1a2e; box-sizing: border-box; }
  #panel summary { font-size: 13px; margin: 0 0 8px; cursor: pointer; user-select: none; }
  #panel summary:hover { color: #e94560; }
  #panel[open] summary { margin-bottom: 8px; }
  .row { display: flex; flex-direction: column; margin-bottom: 6px; }
  .row label { display: flex; justify-content: space-between; font-size: 11px; opacity: 0.85; }
  .row input[type=range] { width: 100%; }
  canvas { image-rendering: pixelated; max-width: 100%; height: auto; }
  #picker { display: flex; gap: 8px; align-items: center; }
  #picker select { font: inherit; background: #1a1a2e; color: #eee; border: 1px solid #444; padding: 2px 4px; }
  #picker button { font: inherit; background: #e94560; color: #eee; border: none; padding: 4px 12px; cursor: pointer; }
  #pickerNote { font-size: 10px; opacity: 0.6; text-align: center; max-width: 480px; }
</style>
</head>
<body>
<div id="stage">
  <div id="picker">
    <select id="botASelect"></select>
    <span>vs</span>
    <select id="botBSelect"></select>
    <button id="fightBtn">Fight!</button>
    <button id="fallbackBtn">Play Sample Fight</button>
  </div>
  <div id="pickerNote"></div>
  <div id="canvasHost"></div>
  <div id="caption">loading…</div>
</div>
<div id="panel">
  <details open>
    <summary>CONFIG (live)</summary>
    <div id="sliders"></div>
  </details>
</div>
<script src="./data/data.js"></script>
<script src="./beats.js"></script>
<script src="./speak.js"></script>
<script type="module">
import { CONFIG, createBody } from './physics.js';
import { createCanvasPair, loadSprite } from './render.js';
import { runFight } from './runner.js';

// beats.js/speak.js are Stream A's classic (non-module) scripts, loaded above —
// they expose window.Beats / window.Speak. Shim onto window.speak so runner.js's
// existing `typeof window.speak === 'function'` check picks it up unchanged.
window.speak = window.Speak.speak;

const pair = createCanvasPair(document.getElementById('canvasHost'));
const captionEl = document.getElementById('caption');
const pickerNoteEl = document.getElementById('pickerNote');
const botASelect = document.getElementById('botASelect');
const botBSelect = document.getElementById('botBSelect');

let currentRunner = null;
let fightGeneration = 0;

function populateSelect(select, bots, defaultName) {
  select.innerHTML = '';
  for (const name of bots) {
    const option = document.createElement('option');
    option.value = name;
    option.textContent = name;
    select.append(option);
  }
  if (bots.includes(defaultName)) select.value = defaultName;
}

function createBodies(nameA, nameB) {
  const bodyA = createBody(60, 50, CONFIG.palette[1]);
  bodyA.name = nameA;
  const bodyB = createBody(100, 50, CONFIG.palette[5]);
  bodyB.name = nameB;
  const bodies = [bodyA, bodyB];
  const targetMap = { a: [bodyA], b: [bodyB], both: [bodyA, bodyB] };
  for (const body of bodies) {
    loadSprite(body.name).then((img) => { body.sprite = img; });
  }
  return { bodies, targetMap };
}

function relabelFight(fight, nameA, nameB) {
  const relabeled = JSON.parse(JSON.stringify(fight));
  for (const beat of relabeled.beats) {
    beat.line = beat.line.split('Tombstone').join(nameA).split('Minotaur').join(nameB);
    if (beat.fact) beat.fact = beat.fact.split('Tombstone').join(nameA).split('Minotaur').join(nameB);
  }
  return relabeled;
}

async function startFight(nameA, nameB) {
  if (currentRunner) currentRunner.stop();
  const myGeneration = ++fightGeneration;
  const { bodies, targetMap } = createBodies(nameA, nameB);

  pickerNoteEl.textContent = '';
  captionEl.textContent = `Generating commentary for ${nameA} vs ${nameB}…`;

  // window.Beats.generate() (beats.js) makes one Anthropic call, validates the
  // result, retries once, and falls back to window.OOF_SAMPLE_BEATS on failure.
  // getApiKey() inside beats.js prompts for a key on first use and caches it in
  // localStorage — no separate key UI needed here.
  const { doc, source } = await window.Beats.generate(nameA, nameB);
  // The fallback fixture is the frozen Tombstone-vs-Minotaur fight — relabel its
  // captions to whichever bots were actually picked so it stays coherent.
  const fight = source === 'fallback' ? relabelFight(doc, nameA, nameB) : doc;
  if (source === 'fallback') {
    pickerNoteEl.textContent = 'Live generation unavailable — playing the sample fight instead.';
  }

  if (myGeneration !== fightGeneration) return; // a newer click superseded this one
  currentRunner = runFight(fight, bodies, targetMap, pair, captionEl);
}

function playFallback(nameA, nameB) {
  if (currentRunner) currentRunner.stop();
  fightGeneration++; // invalidate any in-flight startFight() generation
  const { bodies, targetMap } = createBodies(nameA, nameB);

  pickerNoteEl.textContent = (nameA === 'Tombstone' && nameB === 'Minotaur')
    ? ''
    : `Playing the sample fight, captions relabeled to ${nameA} vs. ${nameB} (choreography stays Tombstone vs. Minotaur).`;

  const fight = relabelFight(window.OOF_SAMPLE_BEATS, nameA, nameB);
  currentRunner = runFight(fight, bodies, targetMap, pair, captionEl);
}

document.getElementById('fightBtn').addEventListener('click', () => {
  startFight(botASelect.value, botBSelect.value);
});
document.getElementById('fallbackBtn').addEventListener('click', () => {
  playFallback(botASelect.value, botBSelect.value);
});

// [key, min, max, step] — world dimensions/floor/walls/pixelScale are excluded:
// they're baked into canvas size at creation, so sliding them live wouldn't resize anything.
const SLIDERS = [
  ['gravity', 100, 800, 10],
  ['floorRestitution', 0.1, 0.9, 0.01],
  ['wallRestitution', 0.1, 0.9, 0.01],
  ['groundDampingLinear', 0.3, 1.0, 0.01],
  ['groundDampingAngular', 0.3, 1.0, 0.01],
  ['botRadius', 3, 30, 0.5],
  ['rotationQuantizeDeg', 1, 45, 1],
  ['eyeStiffness', 10, 300, 5],
  ['eyeDamping', 0, 40, 0.5],
  ['eyeAccelGain', 0, 0.1, 0.001],
  ['eyeClampRadius', 0.5, 10, 0.1],
  ['eyeSocketRadius', 1, 10, 0.1],
  ['pupilRadius', 0.3, 6, 0.1],
  ['eyeOffsetX', 0, 12, 0.1],
  ['eyeOffsetY', -12, 0, 0.1],
  ['squashCoefficient', 0, 0.01, 0.0001],
  ['squashMax', 0, 0.9, 0.01],
  ['squashDecayRate', 1, 40, 1],
  ['cameraShakeMax', 0, 40, 1],
  ['cameraShakeDecayRate', 1, 40, 1],
  ['speakLeadSeconds', 0, 0.5, 0.01],
  ['renderFps', 4, 30, 1],
];

const slidersEl = document.getElementById('sliders');
for (const [key, min, max, step] of SLIDERS) {
  const row = document.createElement('div');
  row.className = 'row';

  const label = document.createElement('label');
  const name = document.createElement('span');
  name.textContent = key;
  const value = document.createElement('span');
  value.textContent = CONFIG[key];
  label.append(name, value);

  const input = document.createElement('input');
  input.type = 'range';
  input.min = min;
  input.max = max;
  input.step = step;
  input.value = CONFIG[key];
  input.addEventListener('input', () => {
    CONFIG[key] = parseFloat(input.value);
    value.textContent = input.value;
  });

  row.append(label, input);
  slidersEl.append(row);
}

Promise.all([
  fetch('./prompts/beats_system.txt').then((r) => r.text()),
  fetch('./sample_beats.json').then((r) => r.json()),
]).then(([systemPrompt, sampleBeats]) => {
  window.OOF_SYSTEM_PROMPT = systemPrompt;
  window.OOF_SAMPLE_BEATS = sampleBeats;

  const bots = window.OOF_DATA.bots.map((b) => b.name);
  populateSelect(botASelect, bots, 'Tombstone');
  populateSelect(botBSelect, bots, 'Minotaur');
  startFight(botASelect.value, botBSelect.value);
});
</script>
</body>
</html>
