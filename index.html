<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OOF: The BattleBots Pro League, Re-enacted Badly</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #111; color: #eee; font: 13px/1.4 monospace; display: flex; }
  #stage { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px; flex: 1; min-width: 0; }
  #canvasHost { max-width: 100%; }
  #caption { white-space: pre; text-align: center; min-height: 2.4em; }
  #panel { width: 280px; flex-shrink: 0; max-height: 100vh; overflow-y: auto; padding: 12px; background: #1a1a2e; box-sizing: border-box; }
  #panel h2 { font-size: 13px; margin: 0 0 8px; }
  .row { display: flex; flex-direction: column; margin-bottom: 6px; }
  .row label { display: flex; justify-content: space-between; font-size: 11px; opacity: 0.85; }
  .row input[type=range] { width: 100%; }
  canvas { image-rendering: pixelated; max-width: 100%; height: auto; }
</style>
</head>
<body>
<div id="stage">
  <div id="canvasHost"></div>
  <div id="caption">loading…</div>
</div>
<div id="panel">
  <h2>CONFIG (live)</h2>
  <div id="sliders"></div>
</div>
<script type="module">
import { CONFIG, createBody } from './physics.js';
import { createCanvasPair, loadSprite } from './render.js';
import { runFight } from './runner.js';

const bodyA = createBody(60, 50, CONFIG.palette[1]);
bodyA.name = 'Tombstone';
const bodyB = createBody(100, 50, CONFIG.palette[5]);
bodyB.name = 'Minotaur';
const bodies = [bodyA, bodyB];

for (const body of bodies) {
  loadSprite(body.name).then((img) => { body.sprite = img; });
}

const pair = createCanvasPair(document.getElementById('canvasHost'));
const captionEl = document.getElementById('caption');
const targetMap = { a: [bodyA], b: [bodyB], both: [bodyA, bodyB] };

// [key, min, max, step] — world dimensions/floor/walls/pixelScale are excluded:
// they're baked into canvas size at creation, so sliding them live wouldn't resize anything.
const SLIDERS = [
  ['gravity', 100, 800, 10],
  ['floorRestitution', 0.1, 0.9, 0.01],
  ['wallRestitution', 0.1, 0.9, 0.01],
  ['groundDampingLinear', 0.3, 1.0, 0.01],
  ['groundDampingAngular', 0.3, 1.0, 0.01],
  ['botRadius', 3, 14, 0.5],
  ['rotationQuantizeDeg', 1, 45, 1],
  ['eyeStiffness', 10, 300, 5],
  ['eyeDamping', 0, 40, 0.5],
  ['eyeAccelGain', 0, 0.1, 0.001],
  ['eyeClampRadius', 0.5, 5, 0.1],
  ['eyeSocketRadius', 1, 5, 0.1],
  ['pupilRadius', 0.3, 3, 0.1],
  ['eyeOffsetX', 0, 6, 0.1],
  ['eyeOffsetY', -6, 0, 0.1],
  ['squashCoefficient', 0, 0.01, 0.0001],
  ['squashMax', 0, 0.9, 0.01],
  ['squashDecayRate', 1, 40, 1],
  ['cameraShakeMax', 0, 40, 1],
  ['cameraShakeDecayRate', 1, 40, 1],
  ['speakLeadSeconds', 0, 0.5, 0.01],
  ['renderFps', 4, 30, 1],
];

const slidersEl = document.getElementById('sliders');
for (const [key, min, max, step] of SLIDERS) {
  const row = document.createElement('div');
  row.className = 'row';

  const label = document.createElement('label');
  const name = document.createElement('span');
  name.textContent = key;
  const value = document.createElement('span');
  value.textContent = CONFIG[key];
  label.append(name, value);

  const input = document.createElement('input');
  input.type = 'range';
  input.min = min;
  input.max = max;
  input.step = step;
  input.value = CONFIG[key];
  input.addEventListener('input', () => {
    CONFIG[key] = parseFloat(input.value);
    value.textContent = input.value;
  });

  row.append(label, input);
  slidersEl.append(row);
}

fetch('./sample_beats.json')
  .then((res) => res.json())
  .then((fight) => runFight(fight, bodies, targetMap, pair, captionEl));
</script>
</body>
</html>
